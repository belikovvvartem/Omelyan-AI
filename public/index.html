<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Приміряти вдома ✨ | Omelyan Mebli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7c3aed;--purple-l:#a78bfa;--blue:#3b82f6;
  --grad:linear-gradient(135deg,#7c3aed 0%,#3b82f6 100%);
  --bg:#0f0f13;--s1:#18181f;--s2:#22222c;
  --border:rgba(255,255,255,.08);--text:#f1f0ff;--muted:#8b8ba0;
  --r:16px;--rs:10px;--font:'Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}

.hdr{position:sticky;top:0;z-index:100;background:rgba(15,15,19,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px}
.hdr-logo{font-size:1rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-sub{font-size:.78rem;color:var(--muted)}
.ai-badge{margin-left:auto;background:var(--s2);border:1px solid rgba(124,58,237,.3);color:var(--purple-l);font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:4px 10px;border-radius:99px;flex-shrink:0}

.page{max-width:540px;margin:0 auto;padding:0 16px 48px}

/* INITIAL LOADER */
.init-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:18px;text-align:center}
.init-spinner{width:40px;height:40px;border:3px solid var(--s2);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}
.init-txt{font-size:.88rem;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}

/* PRODUCT CARD */
.prod-card{display:flex;gap:14px;align-items:flex-start;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:20px}
.prod-img{width:84px;height:84px;object-fit:cover;border-radius:var(--rs);flex-shrink:0;background:var(--s2)}
.prod-name{font-size:1rem;font-weight:600;line-height:1.35;margin-bottom:5px}
.prod-desc{font-size:.78rem;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prod-tag{display:inline-block;margin-top:7px;font-size:.68rem;font-weight:600;color:var(--purple-l);background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.2);padding:3px 9px;border-radius:99px}

/* SECTION LABEL */
.slabel{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}

/* DROP ZONE */
.drop{position:relative;background:var(--s1);border:2px dashed rgba(124,58,237,.3);border-radius:var(--r);min-height:188px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:28px 20px;cursor:pointer;transition:border-color .2s,background .2s;text-align:center;overflow:hidden}
.drop:hover,.drop.over{border-color:var(--purple);background:rgba(124,58,237,.06)}
.drop-icon{width:52px;height:52px;background:rgba(124,58,237,.12);border-radius:50%;display:flex;align-items:center;justify-content:center}
.drop-title{font-size:.92rem;font-weight:600}
.drop-sub{font-size:.76rem;color:var(--muted)}
.drop-btn{background:var(--s2);border:1px solid rgba(124,58,237,.3);color:var(--purple-l);font-size:.79rem;font-weight:600;font-family:var(--font);padding:8px 18px;border-radius:99px;cursor:pointer;transition:background .2s,border-color .2s}
.drop-btn:hover{background:rgba(124,58,237,.15);border-color:var(--purple)}
#fileInput{display:none}
.room-prev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r) - 2px)}
.room-prev-ov{position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:calc(var(--r) - 2px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.drop:hover .room-prev-ov{opacity:1}
.room-prev-ov span{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);color:#fff;font-size:.8rem;font-weight:600;padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.2)}

.btn-gen{width:100%;margin-top:14px;background:var(--grad);border:none;color:#fff;font-family:var(--font);font-size:1rem;font-weight:700;padding:16px 24px;border-radius:var(--r);cursor:pointer;transition:opacity .2s,transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-gen:hover:not(:disabled){opacity:.9;transform:translateY(-1px)}
.btn-gen:active:not(:disabled){transform:translateY(0)}
.btn-gen:disabled{opacity:.35;cursor:not-allowed}
.disclaimer{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.5;padding:0 8px;margin-top:6px}

/* LOADER */
#loaderSec{display:none;flex-direction:column;align-items:center;padding:44px 20px;text-align:center;gap:24px}
.l-ring{position:relative;width:76px;height:76px}
.l-ring svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 1.4s linear infinite}
.l-ring svg circle{fill:none;stroke:url(#gStroke);stroke-width:4;stroke-linecap:round;stroke-dasharray:180;stroke-dashoffset:40}
.l-dots{display:flex;gap:6px;align-items:center}
.l-dot{width:8px;height:8px;border-radius:50%;background:var(--grad);animation:pdot 1.2s ease-in-out infinite}
.l-dot:nth-child(2){animation-delay:.2s}.l-dot:nth-child(3){animation-delay:.4s}
@keyframes pdot{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.2);opacity:1}}
.l-txt{font-size:.92rem;color:var(--muted);line-height:1.6;max-width:260px}
.l-txt strong{display:block;font-size:1rem;font-weight:600;color:var(--text);margin-bottom:4px}
.l-msg{font-style:italic;transition:opacity .25s}
.l-prog{width:190px;height:3px;background:var(--s2);border-radius:99px;overflow:hidden}
.l-prog-bar{height:100%;background:var(--grad);border-radius:99px;width:0%;transition:width .5s ease}

/* RESULT */
#resultSec{display:none;flex-direction:column;gap:14px;padding-bottom:8px}
.res-label{display:flex;align-items:center;gap:8px;font-size:.83rem;font-weight:600;color:var(--muted);margin-top:18px}
.res-label::after{content:'';flex:1;height:1px;background:var(--border)}
.res-img-wrap{border-radius:var(--r);overflow:hidden;background:var(--s1);border:1px solid var(--border)}
#resultImage{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain}
.res-actions{display:flex;flex-direction:column;gap:10px}
.btn-sec{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:.9rem;font-weight:600;padding:14px 20px;border-radius:var(--r);cursor:pointer;transition:background .2s,border-color .2s}
.btn-sec:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.btn-outline{width:100%;background:transparent;border:1px solid rgba(124,58,237,.35);color:var(--purple-l);font-family:var(--font);font-size:.9rem;font-weight:600;padding:14px 20px;border-radius:var(--r);cursor:pointer;transition:background .2s,border-color .2s}
.btn-outline:hover{background:rgba(124,58,237,.08);border-color:var(--purple)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e1e28;border:1px solid rgba(239,68,68,.3);color:#fca5a5;font-size:.83rem;font-weight:500;padding:12px 20px;border-radius:var(--rs);max-width:calc(100vw - 40px);text-align:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* PROVIDER SELECTOR */
.provider-wrap{margin-top:20px}
.provider-label{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.provider-tabs{display:flex;gap:8px;flex-wrap:wrap}
.provider-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border-radius:var(--rs);border:1px solid var(--border);background:var(--s1);cursor:pointer;transition:all .2s;font-size:.82rem;font-weight:600;color:var(--muted);font-family:var(--font)}
.provider-tab:hover{border-color:rgba(124,58,237,.4);color:var(--text)}
.provider-tab.active{border-color:var(--purple);background:rgba(124,58,237,.12);color:var(--purple-l)}
.provider-tab svg{flex-shrink:0;opacity:.7}
.provider-tab.active svg{opacity:1}
.provider-note{font-size:.7rem;color:var(--muted);margin-top:8px;line-height:1.5;padding:0 2px}

@media(min-width:560px){.page{padding:0 24px 60px}.prod-img{width:96px;height:96px}}
</style>

function urlToBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => reject(new Error('CORS'));
    img.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
  });
}

async function fetchB64(url) {
  try { return await urlToBase64(url); } catch {}
  // fallback via fetch (works if server allows)
  const r = await fetch(url);
  const blob = await r.blob();
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = e => res(e.target.result.split(',')[1]);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

function resizeToBlob(dataUrl, maxPx) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxPx || h > maxPx) {
        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else       { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(resolve, 'image/png');
    };
    img.src = dataUrl;
  });
}

// ── LOAD RANDOM PRODUCT FROM FIREBASE ─────────────────────────────────────
async function loadRandomProduct() {
  const snap = await get(ref(db, 'products'));
  if (!snap.exists()) throw new Error('База даних порожня');

  const all = snap.val();
  // Flatten — products can be at root or nested under categories
  const list = [];
  for (const [k, v] of Object.entries(all)) {
    if (v && typeof v === 'object') {
      // check if it's a product (has 'name') or a category (values are products)
      if (v.name) {
        list.push({ id: k, ...v });
      } else {
        for (const [id2, prod] of Object.entries(v)) {
          if (prod && prod.name) list.push({ id: id2, ...prod });
        }
      }
    }
  }

  if (!list.length) throw new Error('Товари не знайдено');

  // Pick random that has at least one photo
  const withPhoto = list.filter(p => {
    const photos = p.photos || (p.photo ? [p.photo] : []);
    return photos.length > 0;
  });
  if (!withPhoto.length) throw new Error('Немає товарів з фото');

  return withPhoto[Math.floor(Math.random() * withPhoto.length)];
}

          <polyline points="17 8 12 3 7 8"/>

      <div class="provider-tabs">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.28 9.88a5.36 5.36 0 0 0-.46-4.4 5.44 5.44 0 0 0-5.85-2.6A5.36 5.36 0 0 0 12 1a5.44 5.44 0 0 0-5.19 3.77 5.36 5.36 0 0 0-3.57 2.6 5.44 5.44 0 0 0 .67 6.38 5.36 5.36 0 0 0 .46 4.4 5.44 5.44 0 0 0 5.85 2.6A5.36 5.36 0 0 0 12 23a5.44 5.44 0 0 0 5.19-3.77 5.36 5.36 0 0 0 3.57-2.6 5.44 5.44 0 0 0-.48-6.75zM12 21.08a4.03 4.03 0 0 1-2.59-.94l.13-.07 4.3-2.48a.71.71 0 0 0 .36-.62v-6.07l1.82 1.05a.07.07 0 0 1 .04.05v5.02A4.06 4.06 0 0 1 12 21.08zm-8.7-3.73a4.03 4.03 0 0 1-.48-2.71l.13.08 4.3 2.48a.71.71 0 0 0 .71 0l5.25-3.03v2.1a.07.07 0 0 1-.03.06L8.85 18.6a4.06 4.06 0 0 1-5.55-1.25zm-1.13-9.4A4.03 4.03 0 0 1 4.3 5.8v5.11a.71.71 0 0 0 .36.62l5.24 3.03-1.82 1.05a.07.07 0 0 1-.07 0L3.6 13.1a4.06 4.06 0 0 1-.43-5.15zm14.95 3.5-5.25-3.03 1.82-1.05a.07.07 0 0 1 .07 0l4.42 2.55a4.04 4.04 0 0 1-.63 7.3V11.1a.71.71 0 0 0-.43-.65zm1.81-2.73-.13-.08-4.3-2.48a.71.71 0 0 0-.71 0L8.54 9.19V7.09a.07.07 0 0 1 .03-.06l4.42-2.55a4.04 4.04 0 0 1 6 3.74zM7.41 12.94l-1.82-1.05a.07.07 0 0 1-.04-.05V6.82a4.04 4.04 0 0 1 6.63-3.1l-.13.07-4.3 2.48a.71.71 0 0 0-.36.62l.02 6.05zm.99-2.13 2.34-1.35 2.34 1.35v2.7l-2.34 1.35-2.34-1.35v-2.7z"/></svg>
          OpenAI
        </button>
        <button class="provider-tab" id="tabIdeogram" type="button">

    <button class="btn-gen" id="generateBtn" disabled>

// ── EVENTS ─────────────────────────────────────────────────────────────────
function bindEvents() {
  const drop  = $('dropZone');
  const input = $('fileInput');

  $('browseBtn').addEventListener('click', e => { e.stopPropagation(); input.click(); });
  drop.addEventListener('click', () => input.click());
  drop.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') input.click(); });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    const f = e.dataTransfer?.files?.[0]; if (f) handleFile(f);
  });
  input.addEventListener('change', () => { if (input.files[0]) handleFile(input.files[0]); });

  $('generateBtn').addEventListener('click', runGeneration);
  $('tryAgainBtn').addEventListener('click', resetToUpload);
  $('saveBtn').addEventListener('click', saveResult);

  // Provider tabs
  $('tabOpenAI').addEventListener('click', () => setProvider('openai'));
  $('tabIdeogram').addEventListener('click', () => setProvider('ideogram'));
  $('tabGemini').addEventListener('click', () => setProvider('gemini'));
}

function handleFile(file) {
  if (!file.type.startsWith('image/')) { toast('Будь ласка, оберіть зображення'); return; }
  if (file.size > 10*1024*1024) { toast('Файл занадто великий (макс. 10 МБ)'); return; }
  roomFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    roomDataUrl = e.target.result;
    showPreview(e.target.result);
    $('generateBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}

function showPreview(dataUrl) {
  const drop = $('dropZone');
  drop.querySelector('.room-prev')?.remove();
  drop.querySelector('.room-prev-ov')?.remove();
  const img = Object.assign(document.createElement('img'), {
    src: dataUrl, className: 'room-prev', alt: 'Фото кімнати'
  });
  const ov = document.createElement('div');
  ov.className = 'room-prev-ov';
  ov.innerHTML = '<span>Змінити фото</span>';
  drop.appendChild(img); drop.appendChild(ov);
  drop.style.minHeight = '170px';
}

function setFormVisible(v) {
  const show = v ? '' : 'none';
  $('prodCard').style.display     = show;
  $('slabel').style.display       = show;
  $('dropZone').style.display     = show;
  $('providerWrap').style.display = show;
  $('generateBtn').style.display  = show;
  $('disclaimer').style.display   = show;
}

function resetToUpload() {
  $('resultSec').style.display = 'none';
  const drop = $('dropZone');
  drop.querySelector('.room-prev')?.remove();
  drop.querySelector('.room-prev-ov')?.remove();
  drop.style.minHeight = '';
  roomFile = null; roomDataUrl = null;
  $('fileInput').value = '';
  $('generateBtn').disabled = true;
  setFormVisible(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveResult() {
  const img = $('resultImage');
  if (!img._b64) return;
  const a = document.createElement('a');
  a.href = `data:${img._mime||'image/png'};base64,${img._b64}`;
  a.download = `omelyan-tryon-${Date.now()}.jpg`;
  a.click();
}

// ── PROVIDER SWITCH ─────────────────────────────────────────────────────────
function setProvider(p) {
  aiProvider = p;
  $('tabOpenAI').classList.toggle('active', p === 'openai');
  $('tabIdeogram').classList.toggle('active', p === 'ideogram');
  $('tabGemini').classList.toggle('active', p === 'gemini');
  const notes = {
    openai:   'OpenAI: редагує ваше реальне фото кімнати, додаючи меблі.',
    ideogram: 'Ideogram: генерує нове зображення інтер\'єру з меблями на основі вашого фото.',
    gemini:   'Gemini 2.0: Google AI редагує фото кімнати, вставляючи меблі реалістично.',
  };
  $('providerNote').textContent = notes[p] || '';
}

// ── GENERATION ─────────────────────────────────────────────────────────────
async function runGeneration() {
  if (!roomDataUrl) { toast('Завантажте фото кімнати'); return; }

  setFormVisible(false);
  $('resultSec').style.display = 'none';
  $('loaderSec').style.display = 'flex';

  let prog = 0, msgIdx = 0;
  const msgEl = $('loaderMsg');
  const bar   = $('progBar');
  bar.style.width = '0%';
  msgEl.textContent = LOADER_MSGS[0];

  const progT = setInterval(() => {
    prog = Math.min(prog + (prog<40?2:prog<70?1:prog<88?.4:.1), 91);
    bar.style.width = prog + '%';
  }, 600);
  const msgT = setInterval(() => {
    msgIdx = (msgIdx+1) % LOADER_MSGS.length;
    msgEl.style.opacity = '0';
    setTimeout(() => { msgEl.textContent = LOADER_MSGS[msgIdx]; msgEl.style.opacity = '1'; }, 250);
  }, 7000);

  try {
    const photos = product.photos || (product.photo ? [product.photo] : []);
    const prodB64 = await fetchB64(photos[0]);

    // ── КРОК 1: GPT-4o описує товар ──────────────────────────────────────
    const descResp = await fetch('/api/openai-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o',
        max_tokens: 300,
        messages: [{
          role: 'user',
          content: [
            { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${prodB64}`, detail: 'high' } },
            { type: 'text', text: `Describe this furniture product in 2-3 sentences for an image editing AI. Include: exact color, material/fabric texture, shape, style, legs, cushions, dimensions. Product name: "${product.name}"${product.description ? ', ' + product.description : ''}. Return ONLY the description, no extra text.` }
          ]
        }]
      })
    });
    if (!descResp.ok) {
      const e = await descResp.json().catch(() => ({}));
      throw new Error(e.error?.message || `GPT-4o помилка (${descResp.status})`);
    }
    const descData = await descResp.json();
    const furnitureDesc = descData.choices[0].message.content.trim();
    console.log('Furniture description:', furnitureDesc);

    let imgB64, imgMime;

    if (aiProvider === 'openai') {
      // ── OpenAI: gpt-image-1 Edit ────────────────────────────────────────
      const roomPngBlob = await resizeToBlob(roomDataUrl, 1024);
      const editPrompt = `Add the following furniture item naturally into this room photo. Keep the room EXACTLY as it is — same walls, floor, lighting, perspective, existing furniture. Only ADD the new furniture piece. Do not change anything else in the room. Place it in a natural, realistic position. Furniture to add: ${furnitureDesc}`;

      const fd = new FormData();
      fd.append('model', 'gpt-image-1');
      fd.append('image[]', roomPngBlob, 'room.png');
      fd.append('prompt', editPrompt);
      fd.append('n', '1');
      fd.append('size', '1024x1024');

      const editResp = await fetch('/api/openai-image-edit', { method: 'POST', body: fd });
      if (!editResp.ok) {
        const e = await editResp.json().catch(() => ({}));
        throw new Error(e.error?.message || `OpenAI Edit API помилка (${editResp.status})`);
      }
      const editData = await editResp.json();
      imgB64 = editData.data?.[0]?.b64_json;
      imgMime = 'image/png';
      if (!imgB64) throw new Error('Зображення не згенеровано. Спробуйте ще раз.');

    } else if (aiProvider === 'gemini') {
      // ── Gemini 2.0 Flash: image generation ─────────────────────────────
      const roomB64  = roomDataUrl.split(',')[1];
      const roomMime = roomDataUrl.split(';')[0].split(':')[1] || 'image/jpeg';

      const geminiPrompt = `You are an interior design AI. Look at this room photo carefully. Add the following furniture naturally into the room. Keep the room EXACTLY as it is — same walls, floor, lighting, perspective, all existing furniture stays. Only ADD the new piece. Place it in a natural, realistic position. Output ONLY the edited room image. Furniture to add: ${furnitureDesc}`;

      const gemResp = await fetch('/api/gemini-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: geminiPrompt, imageBase64: roomB64, imageMime: roomMime }),
      });
      if (!gemResp.ok) {
        const e = await gemResp.json().catch(() => ({}));
        throw new Error(e.error || `Gemini API помилка (${gemResp.status})`);
      }
      const gemData = await gemResp.json();
      imgB64  = gemData.imageBase64;
      imgMime = gemData.imageMime || 'image/png';
      if (!imgB64) throw new Error('Gemini не повернув зображення. Спробуйте ще раз.');

    } else {
      const roomB64 = roomDataUrl.split(',')[1];
      const roomMime = roomDataUrl.split(';')[0].split(':')[1] || 'image/jpeg';

      const ideogramPrompt = `Interior design photo. A well-lit, realistic room with the following furniture naturally placed inside: ${furnitureDesc}. The room should look like a real home interior. Photorealistic, high quality.`;

      const ideogramBody = {
        image_request: {
          prompt: ideogramPrompt,
          model: 'V_2',
          magic_prompt_option: 'AUTO',
          style_type: 'REALISTIC',
          image_resolution: 'RESOLUTION_1024_1024',
          image_weight: 50,
          image: `data:${roomMime};base64,${roomB64}`,
        }
      };

      const ideResp = await fetch('/api/ideogram-generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(ideogramBody)
      });
      if (!ideResp.ok) {
        const e = await ideResp.json().catch(() => ({}));
        throw new Error(e.errorMessage || e.error || `Ideogram API помилка (${ideResp.status})`);
      }
      const ideData = await ideResp.json();
      const imgUrl = ideData.data?.[0]?.url;
      if (!imgUrl) throw new Error('Ideogram не повернув зображення. Спробуйте ще раз.');

      // Fetch the generated image and convert to base64
      const imgResp = await fetch(imgUrl);
      const imgBlob = await imgResp.blob();
      imgMime = imgBlob.type || 'image/jpeg';
      imgB64 = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = e => res(e.target.result.split(',')[1]);
        fr.onerror = rej;
        fr.readAsDataURL(imgBlob);
      });
    }

    clearInterval(progT); clearInterval(msgT);
    bar.style.width = '100%';
    await new Promise(r => setTimeout(r, 350));

    const resImg = $('resultImage');
    resImg.src = `data:${imgMime};base64,${imgB64}`;
    resImg._b64  = imgB64;
    resImg._mime = imgMime;
    resImg.onload = () => {
      $('loaderSec').style.display = 'none';
      $('resultSec').style.display = 'flex';
      $('resultSec').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

  } catch(err) {
    clearInterval(progT); clearInterval(msgT);
    console.error(err);
    $('loaderSec').style.display = 'none';
    toast(err.message || 'Щось пішло не так. Спробуйте ще раз.');
    setFormVisible(true);
  }
}

// ── START ──────────────────────────────────────────────────────────────────
(async () => {
  try {
    product = await loadRandomProduct();
    renderPage();
  } catch(err) {
    console.error(err);
    $('page').innerHTML = `
      <div class="init-wrap">
        <p style="color:#fca5a5;font-size:.9rem">${err.message || 'Не вдалося завантажити товар'}</p>
        <button onclick="location.reload()" style="margin-top:12px;background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:var(--font);padding:10px 20px;border-radius:var(--rs);cursor:pointer">Спробувати ще раз</button>
      </div>`;
  }
})();
</script>
